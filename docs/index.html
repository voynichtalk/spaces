<html lang="en">

<title>One Word or Two</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one centred column, one task per screen, the clip is the hero of each trial. */
:root{
  --bg:#eceee6; --surface:#f7f8f3; --ink:#26221c; --muted:#6c6858; --line:#cfd2c4;
  --accent:#2f6f73; --accent-ink:#f4f7f5; --mark:#b8321e; --test:#8a5a00;
  --display:"Spectral", Georgia, "Times New Roman", serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#181a16; --surface:#22251f; --ink:#ebe8de; --muted:#a6a290; --line:#3a3d33;
  --accent:#6fb3b6; --accent-ink:#0f1a1a; --mark:#ff7a63; --test:#e0b04a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#181a16; --surface:#22251f; --ink:#ebe8de; --muted:#a6a290; --line:#3a3d33;
  --accent:#6fb3b6; --accent-ink:#0f1a1a; --mark:#ff7a63; --test:#e0b04a; color-scheme:dark }
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:17px/1.55 var(--body);
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
main{max-width:760px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:22px;min-height:100%}
h1,h2{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,6vw,44px)} h2{font-size:clamp(22px,4.5vw,28px)}
p{margin:0;max-width:62ch}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:10px;align-items:center}
.test{color:var(--test);border:1px solid currentColor;border-radius:4px;padding:0 6px;letter-spacing:.08em}
.stack{display:flex;flex-direction:column;gap:14px}
.fine{font-size:14px;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 22px;font-weight:700;align-self:flex-start}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-weight:700;margin-bottom:6px}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.opt input{margin-top:5px;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent)}
/* trial */
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress div{height:100%;background:var(--accent);width:0;transition:width .2s}
.clipbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;justify-content:center}
canvas#clip{max-width:100%;height:auto;display:block;border-radius:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:18px 10px;font-family:var(--display);font-size:clamp(20px,4.5vw,26px);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.choice small{font-family:var(--body);font-size:12px;font-weight:400;color:var(--muted)}
.choice:hover{border-color:var(--accent)}
.choice:active{transform:translateY(1px)}
.choice:disabled{opacity:.5}
.q{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.legend-mark{display:inline-block;width:26px;height:10px;border:2.5px solid var(--mark);border-bottom:0;vertical-align:middle;margin:0 2px}
.stat{font-family:var(--display);font-size:clamp(34px,8vw,52px);font-weight:700;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.rows{display:grid;grid-template-columns:1fr auto;gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-variant-numeric:tabular-nums}
.rows span:nth-child(even){text-align:right;font-weight:700}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
details pre{white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:260px;overflow:auto}
@media (prefers-reduced-motion: reduce){ .progress div{transition:none} }
</style>
</head>

  for (let attempt = 0; attempt < 2; attempt++){
    try {
      await fetch(FORM, { method: 'POST', mode: 'no-cors', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: body.toString() });
      state.saved = true; if (final){ mem.finishedAt = data.savedAt; mem.runs = (mem.runs||0) + 1; remember(); } return;
    } catch(e) {}
    await new Promise(res => setTimeout(res, 800 + Math.random()*800));
  }
  state.saved = false;
}

// ---------- screens ----------
function screen(html){ app.innerHTML = html; app.scrollTop = 0; window.scrollTo(0,0); const f = app.querySelector('[autofocus]'); f && f.focus(); }
const head = (step) => `<div class="eyebrow"><span>Voynich Talk · reader study</span>${step ? `<span>${step}</span>` : ''}</div>`;

async function welcome(){
  screen(`${head()}
    <h1>One word or two?</h1>
    <div class="stack">
      <p>The Voynich manuscript is written in a script nobody can read. Its scribes left spaces between words, but some of those spaces are so small that even the people who transcribe the text cannot agree on them.</p>
      <p>You will see ${ITEMS.length + 2} short snippets. In each, red brackets above and below the middle line mark one spot. Decide whether the scribe wrote <b>one word</b> or <b>two words</b> there. Go with your first impression: there is no right answer.</p>
      <p>They come in rounds of 12. After each round your answers are saved and you can stop, or carry on.</p>
      <p class="fine">Anonymous: we store your answers and your three answers about yourself, nothing else. It takes about four minutes.</p>
      <input id="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    </div>
    <div id="prior"></div>
    ${isClosed()
      ? `<p><b>The study has closed.</b> Results were collected until Sunday 8 November 2026. You are welcome to try the test to see what it was about, but your answers are no longer saved or counted.</p>`
      : `<p class="fine">Open for contributions until Sunday 8 November 2026 (end of the day, CET).</p>`}
    <button class="btn" id="go" autofocus>${isClosed() ? 'Try it anyway' : 'Start'}</button>`);
  document.getElementById('go').onclick = background;
  const prev = await existing();
  if (prev && prev.finished) document.getElementById('prior').innerHTML = `<p class="fine">You already took part on ${new Date(prev.updatedAt).toLocaleDateString()}. You are welcome to do it again; it is stored as a separate run.</p>`;
}

function background(){
  const opt = (name, v, label) => `<label class="opt"><input type="radio" name="${name}" value="${v}" required><span>${label}</span></label>`;
  screen(`${head('About you')}
    <h2>First, three quick questions</h2>
    <form id="f" class="stack">
      <fieldset><legend>How well do you know the Voynich manuscript?</legend>
        ${opt('know',0,'I had never heard of it before today')}
        ${opt('know',1,'I have seen a video or read an article or two')}
        ${opt('know',2,'I follow the research and know its sections and scribes')}
        ${opt('know',3,'I do my own research on the text')}
      </fieldset>
      <fieldset><legend>Do you know EVA, the alphabet researchers use to write the Voynich script in Latin letters (words like <i>daiin</i> or <i>qokeedy</i>)?</legend>
        ${opt('eva',0,'No')}
        ${opt('eva',1,'I have seen it, but I could not read the script with it')}
        ${opt('eva',2,'Yes, I can read the script in EVA')}
        ${opt('eva',3,'Yes, I work with EVA transliterations')}
      </fieldset>
      <fieldset><legend>In Voynich words, where does the glyph EVA writes as <b>q</b> usually stand?</legend>
        ${opt('q','start','At the start of a word')}
        ${opt('q','middle','In the middle of a word')}
        ${opt('q','end','At the end of a word')}
        ${opt('q','unsure','I don\'t know')}
      </fieldset>
      <button class="btn" id="next" disabled>Continue</button>
    </form>`);
  const f = document.getElementById('f');
  f.oninput = () => { document.getElementById('next').disabled = !['know','eva','q'].every(n => f.querySelector(`input[name=${n}]:checked`)); };
  f.onsubmit = e => { e.preventDefault(); const v = n => f.querySelector(`input[name=${n}]:checked`).value;
    state.profile = { know: +v('know'), eva: +v('eva'), q: v('q') }; instructions(); };
}

function instructions(){
  screen(`${head('How it works')}
    <h2>Look at the bracket, then choose</h2>
    <div class="stack">
      <p>Each snippet shows five lines, so you can compare with the spacing around it. The spot to judge is in the middle of the centre line, between the red brackets.</p>
      <p>Tap <b>One word</b> or <b>Two words</b>. On a keyboard you can press <b>1</b> or <b>2</b>. You can't go back, so don't overthink it.</p>
    </div>
    <button class="btn" id="go" autofocus>Show the first snippet</button>`);
  document.getElementById('go').onclick = startTrials;
}

// ---------- trials ----------
let order = [], ti = 0, shownAt = 0;
const imgCache = {};
function loadImg(src){ return imgCache[src] ||= new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }
function shuffle(a){ for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function startTrials(){
  state.startedAt = new Date().toISOString(); state.sid = newSid();
  order = shuffle(ITEMS.map((_, k) => k));
  // two repeats for a consistency check, both inside the first block of 12:
  // the first two snippets come back as snippets 9 and 12
  const reps = order.slice(0, 2);
  order.splice(8, 0, reps[0]);
  order.splice(11, 0, reps[1]);
  order = order.map((k, pos) => ({ k, repeat: order.indexOf(k) < pos }));
  ti = 0; trial();
}
async function trial(){
  const t = order[ti], it = ITEMS[t.k];
  screen(`${head(`${ti+1} of ${order.length}`)}
    <div class="progress" aria-hidden="true"><div style="width:${ti/order.length*100}%"></div></div>
    <div class="q"><h2>One word or two?</h2><span class="fine">Between the red brackets</span></div>
    <div class="clipbox"><canvas id="clip" role="img" aria-label="Snippet of Voynich script with a bracket over the spot to judge"></canvas></div>
    <div class="choices">
      <button class="choice" data-a="1" disabled>One word<small>key 1</small></button>
      <button class="choice" data-a="2" disabled>Two words<small>key 2</small></button>
    </div>`);
  const img = await loadImg(it.img);
  const crop = drawClip(document.getElementById('clip'), img, it);
  if (order[ti+1]) loadImg(ITEMS[order[ti+1].k].img);
  requestAnimationFrame(() => { shownAt = performance.now(); app.querySelectorAll('.choice').forEach(b => { b.disabled = false; b.onclick = () => answer(b.dataset.a, crop); }); });
}
function drawClip(cv, img, it){
  // narrow screens: show the centre of the clip at full height so the script stays legible
  const narrow = innerWidth < 600;
  const sw = narrow ? Math.min(it.w, Math.round(it.h * 1.8)) : it.w, sx = Math.round((it.w - sw)/2);
  const dpr = devicePixelRatio || 1, cssW = Math.min(cv.parentElement.clientWidth - 20, sw * 1.5), s = cssW / sw;
  cv.width = Math.round(sw * s * dpr); cv.height = Math.round(it.h * s * dpr); cv.style.width = cssW + 'px';
  const g = cv.getContext('2d'); g.setTransform(dpr*s, 0, 0, dpr*s, -sx*dpr*s, 0);
  g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, it.w, it.h);
  // Two brackets frame the stretch on the centre line: one above, one below, ends pointing inwards.
  // The clip is centred on the space and five lines tall, so the line pitch is h/5 and the centre line sits at h/2.
  const [x, , w] = it.xy, pitch = it.h / 5, cy = it.h / 2, off = .46 * pitch, tick = .16 * pitch, pad = .08 * pitch;
  const x0 = x - pad, x1 = x + w + pad;
  g.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--mark').trim() || '#b8321e';
  g.lineWidth = Math.max(2, pitch * .045); g.lineCap = g.lineJoin = 'round';
  g.beginPath();
  g.moveTo(x0, cy - off + tick); g.lineTo(x0, cy - off); g.lineTo(x1, cy - off); g.lineTo(x1, cy - off + tick);
  g.moveTo(x0, cy + off - tick); g.lineTo(x0, cy + off); g.lineTo(x1, cy + off); g.lineTo(x1, cy + off - tick);
  g.stroke();
  return narrow ? 'centre' : 'full';
}
async function answer(a, crop){
  if (busy) return; busy = true;
  const t = order[ti], it = ITEMS[t.k];
  state.answers.push({ item: it.id, answer: a === '1' ? 'one' : 'two', rtMs: Math.round(performance.now() - shownAt), pos: ti, repeat: t.repeat, view: crop });
  ti++;
  busy = false;
  if (ti >= order.length) finish();
  else if (ti % BLOCK === 0) pause();
  else trial();
}
// ---------- break after every block ----------
const BLOCK = 12;
function pause(){
  saveSession(false);                                   // keep what's done so far, in the background
  const left = order.length - ti, next = Math.min(BLOCK, left);
  screen(`${head(`${ti} of ${order.length}`)}
    <div class="progress" aria-hidden="true"><div style="width:${ti/order.length*100}%"></div></div>
    <h2>${ti} done, ${left} to go</h2>
    <p>Your answers so far are saved. You can stop here, or do ${next === left ? 'the last' : 'another'} ${next}.</p>
    <div class="choices">
      <button class="choice" id="more" autofocus>Keep going<small>${next} more</small></button>
      <button class="choice" id="stop">Stop here<small>see your result</small></button>
    </div>`);
  document.getElementById('more').onclick = trial;
  document.getElementById('stop').onclick = () => finish(true);
}
document.addEventListener('keydown', e => {
  if (e.key !== '1' && e.key !== '2') return;
  const b = app.querySelector(`.choice[data-a="${e.key}"]`); if (b && !b.disabled) b.click();
});

// ---------- end ----------
async function finish(stopped){
  state.stoppedEarly = !!stopped;
  screen(`${head('Done')}<h2>Saving your answers…</h2>`);
  await saveSession(true);
  const first = state.answers.filter(a => !a.repeat), byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
  const two = first.filter(a => a.answer === 'two').length;
  const grp = z => first.filter(a => byId[a.item].zl === z);
  const pct = (arr) => arr.length ? Math.round(arr.filter(a => a.answer === 'two').length / arr.length * 100) + '%' : '–';
  const reps = state.answers.filter(a => a.repeat);
  const same = reps.filter(r => first.find(f => f.item === r.item).answer === r.answer).length;
  screen(`${head('Done')}
    <h1>Thank you!</h1>
    <div class="stack">
      <p>You saw two words in</p>
      <div class="stat">${two} of ${first.length}</div>
      <p>The transcription we compare with (Zandbergen-Landini) writes some of these spots as two words, some as one, and for some it marks the space as uncertain. How often you said “two words” in each group:</p>
      <div class="rows">
        <span>Transcription: two words</span><span>${pct(grp('space'))}</span>
        <span>Transcription: uncertain</span><span>${pct(grp('uncertain'))}</span>
        <span>Transcription: one word</span><span>${pct(grp('joined'))}</span>
        <span>Shown twice, same answer</span><span>${same} of ${reps.length}</span>
      </div>
      <p class="fine">${state.saved ? 'Your answers are saved.' : 'Your answers could not be saved (no connection?). Try “Run the test again” later.'} How everyone else saw it comes in a follow-up video.</p>
    </div>
    <button class="btn ghost" id="again">Run the test again</button>`);
  document.getElementById('again').onclick = () => { state.answers = []; welcome(); };
}

welcome();
</script>
</body>
</html>
